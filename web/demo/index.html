<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATO Scholarship | Kappa Eta</title>
    <meta
      name="description"
      content="A proof-of-concept scholarship portal for ATO Kappa Eta. Fictional data only."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23264167'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='serif' font-size='40' fill='%23FDB144'%3EA%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body>
    <div class="demo-bar">
      <span
        ><strong>DEMO SANDBOX</strong> Fictional records · browser-simulated API ·
        no chapter data</span
      ><div class="demo-bar-actions"><button data-action="reset" class="text-btn">Reset demo</button><button data-action="logout" class="text-btn" aria-keyshortcuts="Backspace">Sign out</button></div>
    </div>
    <header class="masthead">
      <a class="brand" href="#overview" aria-label="ATO Scholarship home"
        ><img class="brand-logo" src="/ato-logo.png" alt="" width="582" height="152"
        ><span class="brand-name"
          >ALPHA TAU OMEGA<span>KAPPA ETA · FLORIDA TECH</span></span
        ></a
      >
      <div class="header-right">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="true">Light mode</button>
        <span class="term">FALL 2026</span
        ><button class="account-button" data-action="account" hidden>
          <span class="avatar"></span
          ><span id="header-person"></span>
        </button>
      </div>
    </header>
    <div class="workspace">
      <aside class="sidebar">
        <div class="portal-label">SCHOLARSHIP PORTAL</div>
        <nav id="nav" aria-label="Main navigation"></nav>
        <div class="sidebar-bottom">
          <span class="eyebrow">EXPLORE THE DEMO</span
          ><label for="persona">View as</label
          ><select id="persona">
            <option value="alex">Noah Knickerbocker · Member</option>
            <option value="jordan">Jordan Ellis · Member</option>
            <option value="chair">Scholarship chair</option>
          </select>
          <p>Sign out to try the other demo account.</p>
        </div>
      </aside>
      <main id="main"><div class="page-heading"><div><h1>Loading demo</h1><p>Checking account view…</p></div></div></main>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <script src="app.js"></script>
  </body>
</html>
