<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATO Scholarship Portal | Kappa Eta</title>
    <meta
      name="description"
      content="Private scholarship portal for ATO Kappa Eta."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23264167'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='serif' font-size='40' fill='%23FDB144'%3EA%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body class="portal-loading">
    <div id="auth-loading" class="auth-loading" role="status" aria-live="polite" aria-atomic="true">
      <div class="auth-loading-content">
        <ato-loading-cross class="auth-cross" aria-hidden="true">
          <svg viewBox="-84 -84 168 168" width="152" height="152" focusable="false">
            <!-- Four identical arms and a fixed ring share the SVG origin. -->
            <g class="auth-cross-rotor" fill="currentColor">
              <g><path class="auth-cross-arm" d="M-50.5-75.5H50.5L20.849-31.17A37.5 37.5 0 0 0-20.849-31.17Z" /></g>
              <g transform="rotate(90)"><path class="auth-cross-arm" d="M-50.5-75.5H50.5L20.849-31.17A37.5 37.5 0 0 0-20.849-31.17Z" /></g>
              <g transform="rotate(180)"><path class="auth-cross-arm" d="M-50.5-75.5H50.5L20.849-31.17A37.5 37.5 0 0 0-20.849-31.17Z" /></g>
              <g transform="rotate(270)"><path class="auth-cross-arm" d="M-50.5-75.5H50.5L20.849-31.17A37.5 37.5 0 0 0-20.849-31.17Z" /></g>
            </g>
            <circle class="auth-cross-center" cx="0" cy="0" r="26.5" fill="none" stroke="currentColor" stroke-width="10" />
          </svg>
        </ato-loading-cross>
        <p id="auth-loading-message">Checking sign-in…</p>
      </div>
    </div>
    <div class="demo-bar">
      <span
        ><strong>SCHOLARSHIP PORTAL</strong> Loading…</span
      ><button data-action="reset" class="text-btn" hidden>Reset demo</button>
    </div>
    <header class="masthead">
      <a class="brand" href="#overview" aria-label="ATO Scholarship home"
        ><img class="brand-logo" src="/ato-logo.png" alt="" width="582" height="152"
        ><span class="brand-name"
          >ALPHA TAU OMEGA<span>KAPPA ETA · FLORIDA TECH</span></span
        ></a
      >
      <div class="header-right">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="true">Light mode</button>
        <span class="term">Current semester</span
        ><button class="account-button" data-action="account" hidden>
          <span class="avatar"></span
          ><span id="header-person"></span>
        </button>
      </div>
    </header>
    <div class="workspace">
      <aside class="sidebar">
        <div class="portal-label">SCHOLARSHIP PORTAL</div>
        <div class="nav-strip">
          <button id="nav-prev" class="nav-scroll" type="button" aria-label="Show earlier tabs" hidden>‹</button>
          <nav id="nav" aria-label="Main navigation"></nav>
          <button id="nav-next" class="nav-scroll" type="button" aria-label="Show more tabs" hidden>›</button>
        </div>
        <div class="sidebar-bottom" style="display:none">
          <span class="eyebrow">EXPLORE THE DEMO</span
          ><label for="persona">View as</label
          ><select id="persona">
            <option value="alex">Noah Knickerbocker · Member</option>
            <option value="jordan">Jordan Ellis · Member</option>
            <option value="chair">Scholarship chair</option>
          </select>
          <p>Switch roles to test member and chair views.</p>
        </div>
      </aside>
      <main id="main">
        <div class="page-heading">
          <div>
            <h1>Loading portal</h1>
            <p>Checking sign-in…</p>
          </div>
        </div>
      </main>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <script type="module" src="/loading-cross.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
