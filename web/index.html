<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATO Scholarship Portal | Kappa Eta</title>
    <meta
      name="description"
      content="Private scholarship portal for ATO Kappa Eta."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23264167'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='serif' font-size='40' fill='%23FDB144'%3EA%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body class="portal-loading">
    <div id="auth-loading" class="auth-loading" role="status" aria-live="polite" aria-atomic="true">
      <div class="auth-loading-content">
        <svg class="auth-cross" viewBox="-8 -8 168 168" width="152" height="152" aria-hidden="true" focusable="false">
          <!-- The cross occupies the rightmost 152 pixels of the original logo. -->
          <defs>
            <clipPath id="loading-cross-top"><path d="M0 0h152L76 76Z" /></clipPath>
            <clipPath id="loading-cross-right"><path d="M152 0v152L76 76Z" /></clipPath>
            <clipPath id="loading-cross-bottom"><path d="M152 152H0l76-76Z" /></clipPath>
            <clipPath id="loading-cross-left"><path d="M0 152V0l76 76Z" /></clipPath>
            <clipPath id="loading-cross-center"><circle cx="76" cy="76" r="34.5" /></clipPath>
            <mask id="loading-cross-arms" maskUnits="userSpaceOnUse" x="-8" y="-8" width="168" height="168">
              <rect x="-8" y="-8" width="168" height="168" fill="white" />
              <circle cx="76" cy="76" r="34.5" fill="black" />
            </mask>
          </defs>
          <g class="auth-cross-rotor">
            <g class="auth-cross-arm auth-cross-arm-top" clip-path="url(#loading-cross-top)" mask="url(#loading-cross-arms)"><image href="/ato-logo.png" x="-430" y="0" width="582" height="152" /></g>
            <g class="auth-cross-arm auth-cross-arm-right" clip-path="url(#loading-cross-right)" mask="url(#loading-cross-arms)"><image href="/ato-logo.png" x="-430" y="0" width="582" height="152" /></g>
            <g class="auth-cross-arm auth-cross-arm-bottom" clip-path="url(#loading-cross-bottom)" mask="url(#loading-cross-arms)"><image href="/ato-logo.png" x="-430" y="0" width="582" height="152" /></g>
            <g class="auth-cross-arm auth-cross-arm-left" clip-path="url(#loading-cross-left)" mask="url(#loading-cross-arms)"><image href="/ato-logo.png" x="-430" y="0" width="582" height="152" /></g>
            <image href="/ato-logo.png" x="-430" y="0" width="582" height="152" clip-path="url(#loading-cross-center)" />
          </g>
        </svg>
        <p id="auth-loading-message">Checking sign-in…</p>
      </div>
    </div>
    <div class="demo-bar">
      <span
        ><strong>SCHOLARSHIP PORTAL</strong> Loading…</span
      ><button data-action="reset" class="text-btn" hidden>Reset demo</button>
    </div>
    <header class="masthead">
      <a class="brand" href="#overview" aria-label="ATO Scholarship home"
        ><img class="brand-logo" src="/ato-logo.png" alt="" width="582" height="152"
        ><span class="brand-name"
          >ALPHA TAU OMEGA<span>KAPPA ETA · FLORIDA TECH</span></span
        ></a
      >
      <div class="header-right">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="true">Light mode</button>
        <span class="term">Current semester</span
        ><button class="account-button" data-action="account" hidden>
          <span class="avatar"></span
          ><span id="header-person"></span>
        </button>
      </div>
    </header>
    <div class="workspace">
      <aside class="sidebar">
        <div class="portal-label">SCHOLARSHIP PORTAL</div>
        <div class="nav-strip">
          <button id="nav-prev" class="nav-scroll" type="button" aria-label="Show earlier tabs" hidden>‹</button>
          <nav id="nav" aria-label="Main navigation"></nav>
          <button id="nav-next" class="nav-scroll" type="button" aria-label="Show more tabs" hidden>›</button>
        </div>
        <div class="sidebar-bottom" style="display:none">
          <span class="eyebrow">EXPLORE THE DEMO</span
          ><label for="persona">View as</label
          ><select id="persona">
            <option value="alex">Noah Knickerbocker · Member</option>
            <option value="jordan">Jordan Ellis · Member</option>
            <option value="chair">Scholarship chair</option>
          </select>
          <p>Switch roles to test member and chair views.</p>
        </div>
      </aside>
      <main id="main">
        <div class="page-heading">
          <div>
            <h1>Loading portal</h1>
            <p>Checking sign-in…</p>
          </div>
        </div>
      </main>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <script src="/app.js"></script>
  </body>
</html>
